<!DOCTYPE html> 
<html lang="fr"> 
    <head> 
        <meta charSet="utf-8" /> 
        <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    </head> 
    <body> 
        <div id="square" style="width: 300px; height: 300px; background-color: silver;">

        </div> 
        <button id="btn" >
            Click Me!
        </button> 
        <script> 
        const caree=document.getElementById("square")
        const bouton=document.getElementById("btn")
        caree.style.color="white"
        caree.style.backgroundColor="red";
        let i=0;
        bouton.addEventListener("click", function(){
            caree.innerHTML+="Ligne"+i+"<br>"
            i++;
        })
        </script> 
    </body> 
</html>
