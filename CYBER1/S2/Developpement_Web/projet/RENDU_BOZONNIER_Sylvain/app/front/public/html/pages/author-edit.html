<h1 class="page-title">Modifier un auteur</h1>
<hr class="page-divider">
<div class="form-fields">
  <input class="form-input" type="text" id="author-name" placeholder="Nom de l'auteur">
  <button class="form-btn" id="submit-btn">Valider les modifications</button>
  <p id="form-message"></p>
</div>
<div class="author-books-section">
  <div class="author-books-title">Livres de l'auteur</div>
  <table class="data-table">
    <thead>
      <tr>
        <th>Nom du livre</th>
        <th>État</th>
      </tr>
    </thead>
    <tbody id="author-books-body"></tbody>
  </table>
</div>
