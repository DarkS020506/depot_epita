<h1 class="page-title">Ajouter un livre</h1>
<hr class="page-divider">
<div class="form-fields">
  <input class="form-input" type="text" id="book-title" placeholder="Nom du livre">
  <select class="form-select" id="book-author">
    <option value="" disabled selected>Nom d'un auteur</option>
  </select>
  <select class="form-select" id="book-status">
    <option value="" disabled selected>En stock / emprunté</option>
    <option value="en stock">en stock</option>
    <option value="emprunté">emprunté</option>
  </select>
  <button class="form-btn" id="submit-btn">Ajouter le livre</button>
  <p id="form-message"></p>
</div>
