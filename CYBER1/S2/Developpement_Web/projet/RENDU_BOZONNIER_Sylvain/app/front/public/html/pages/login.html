<div class="login-page">
  <div class="login-card">
    <div class="login-title">Connexion</div>
    <form id="login-form" style="width:100%;display:flex;flex-direction:column;gap:14px;">
      <input class="login-input" type="text" name="login" placeholder="Login *" required autocomplete="username">
      <input class="login-input" type="password" name="password" placeholder="Mot de passe *" required autocomplete="current-password">
      <button class="login-btn" type="submit">Connexion</button>
    </form>
    <p class="login-error" id="login-error"></p>
  </div>
</div>
